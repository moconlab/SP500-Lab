sp500_analytics:
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: your-gcp-project-id
      dataset: sp500_dev
      threads: 4
      timeout_seconds: 300
      location: US
      priority: interactive
    
    prod:
      type: bigquery
      method: service-account
      project: your-gcp-project-id
      dataset: sp500_prod
      threads: 8
      timeout_seconds: 300
      location: US
      priority: interactive
      keyfile: /path/to/service-account-key.json
  
  target: dev

