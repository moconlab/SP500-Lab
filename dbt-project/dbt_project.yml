name: 'sp500_analytics'
version: '1.0.0'
config-version: 2

profile: 'sp500_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sp500_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      finance:
        +materialized: table
        +schema: finance
      features:
        +materialized: table
        +schema: features
